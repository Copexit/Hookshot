# RX_VK_LIVE_CFGS / RX_VK_BENCH_CONFIGS format: "<name>: SWITCH=value ...", only the runtime (hc) switches of
# gpu/vk/vk_internal.h; a switch left out keeps its startup value, so "base:" is the launch environment.
# base2 repeats base as a sanity row (it must come out ~0%, not significant).
base:
base2:
ov: RX_VK_BATCH_IDLE=1 RX_VK_ORDER_WAKE=1 RX_VK_SEG_FIRST=2 RX_VK_SIGNAL_FLUSH=1 RX_VK_BARRIER_NARROW=1 RX_VK_BARRIER_DEFER=1 RX_VK_DISPATCH_INDEP=1
ovpf: RX_VK_BATCH_IDLE=1 RX_VK_ORDER_WAKE=1 RX_VK_SEG_FIRST=2 RX_VK_SIGNAL_FLUSH=1 RX_VK_BARRIER_NARROW=1 RX_VK_BARRIER_DEFER=1 RX_VK_DISPATCH_INDEP=1 RX_VK_PIECE_FLUSH=64
